type Client {
  id: ID!
  name: String
  age: Int
  documents(limit: Int = 50, offset: Int = 0): [Document!]!
  relatives(limit: Int = 50, offset: Int = 0): [Relative!]!
}

type Document {
  id: ID!
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID!
  relationType: String
  name: String
  age: Int
}

type Query {
  client(id: ID!): Client
}